name: Historical Benchmark (manual)

# Optional, manually-triggered benchmark. Not part of pull-request CI: it is
# heavier and intended for occasional performance tracking. It still uses the
# synthetic end-to-end path by default; the full historical dataset is not
# available in CI and must be provided out of band.

on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Benchmark repetitions"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  benchmark:
    name: Bronze benchmark (synthetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-spark.txt \
            -r requirements-dev.txt
      - name: Run end-to-end synthetic pipeline
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_end_to_end.py -q
